# 发布新版本：打一个 v* 标签，CI 打包两个平台并创建一个 Release **草稿**。
#
# 日常用法（本地跑这两条，剩下交给 CI）：
#   npm version patch          # 改版本号 + 提交 + 打 v0.1.1 标签
#   git push --follow-tags     # 把提交和标签一起推上去
#
# 产物包含：
#   Windows：DSH Console Setup x.y.z.exe（NSIS 安装包）、DSH Console x.y.z.exe（便携版）
#   macOS：  DSH Console-x.y.z-arm64.dmg / -x64.dmg（安装镜像）+ 同名 .zip（免安装）
#   latest.yml / latest-mac.yml + *.blockmap   更新元数据（差分下载用；现在没接自动更新，先留着）
#
# Release 正文来自 **CHANGELOG.md 里对应版本的条目**（`tools/changelog-extract.mjs` 提取，
# 末尾附一段固定的下载指引）。所以**发版前必须先写 CHANGELOG**：缺条目时提取脚本会非零退出、
# publish job 直接失败 —— 宁可不发，也不发一个没有说明的 Release。
#
# 在 Actions 页面手动触发时**只构建不发 Release**（用来验证流水线），
# 产物可以从这次运行的 Artifacts 里下载。
#
# ── 为什么分成 build-* / publish 三步，而不是两个平台各自 publish ──
#
# v0.2.0 丢过 Windows 产物：两个 runner 各自跑 `electron-builder --publish always`，
# 两边并发走到 `getOrCreateRelease()` 都发现"没有 release"就各建一个，互相打架；
# 更麻烦的是 electron-builder 默认 releaseType=draft —— release 一旦被人点成"已发布"，
# 后续上传会被**静默跳过**（步骤显示成功，只在日志里 warn 一句），所以"重跑一次 CI 补上"
# 这条路走不通。
#
# 现在改成：两个平台只打包（--publish never），产物挂成 Artifacts；标签构建时由
# **单独一个 publish job** 收齐两边的产物，一次建草稿、一次上传。没有并发建 release
# 的窗口，也不再依赖 electron-builder 的发布逻辑（重跑时 gh release upload --clobber
# 会覆盖同名产物，可以放心重试）。
#
# 说明：两个平台各在自己的 runner 上打包（node-pty 是原生模块，必须对目标平台构建）。
# 原生模块由 electron-builder 自动对着打包用的 Electron 版本重编，所以这里**不要**加
# --config.npmRebuild=false（runner 上有 C++ 工具链；node-pty 是 N-API，跨 Electron
# 大版本也不需要改代码）。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 打包（不发布）
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 自检
        run: npm test

      - name: 打包
        shell: pwsh
        run: |
          npm run build
          # 只打包不发布：Release 由下面的 publish job 统一创建
          npx electron-builder --win --publish never

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } |
            ForEach-Object { "{0,-40} {1,5} MB" -f $_.Name, [int]($_.Length / 1MB) }

      # 无条件上传：publish job 要靠这两个 artifact 建 Release
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-console-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 自检
        run: npm test

      # 未签名的构建：本地/CI 出来的 .app 首次打开需要右键「打开」绕过 Gatekeeper。
      # 要正式分发就得配 CSC_LINK / CSC_KEY_PASSWORD（开发者证书）并做公证。
      - name: 打包（macOS，arm64 + x64）
        run: |
          npm run build
          npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 列出产物
        run: ls -lh release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-console-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 7

  # ---------------------------------------------------------------- 建草稿并上传（仅标签）
  publish:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # 取仓库里的 CHANGELOG.md 与提取脚本（Release 正文就来自 CHANGELOG）
      - uses: actions/checkout@v4

      - name: 收齐两个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh assets

      # 正文 = CHANGELOG 里这一版的条目 + 一段固定的下载指引。
      # 条目缺失或为空时提取脚本会非零退出，这一步直接失败 —— 宁可不发版，也不发一个空说明。
      - name: 从 CHANGELOG 取出这一版的说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node tools/changelog-extract.mjs "$TAG" > notes.md
          cat >> notes.md <<'FOOTER'

          ---

          **下载**：Windows 用 `Setup` 安装包（推荐，装新版即原地覆盖，同目录同快捷方式、
          设置与日志保留）或免安装的便携版；macOS 用 `arm64.dmg`（Apple 芯片）或 `.dmg`（Intel）。
          每个安装包旁边还有对应的 `.zip` 免安装版。macOS 包未签名，首次打开请**右键 →「打开」**，
          或到「系统设置 → 隐私与安全性」点「仍要打开」。
          FOOTER
          echo "---- 本次 Release 正文 ----"
          cat notes.md

      # gh 是 runner 自带的；GH_REPO 显式指定，避免依赖"当前目录是个 git 仓库"
      - name: 创建草稿 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在（多半是重跑）：只补产物，正文不动 —— 免得覆盖掉人工改过的说明
            echo "Release $TAG 已存在：补传产物，正文保持不变"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" assets/* --clobber
          echo "---- 传完后的资产清单 ----"
          gh release view "$TAG" --json assets --jq '.assets[].name'
