<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'self' file:; frame-src http: https:"
    />
    <title>DSH Console</title>
    <!-- 样式与脚本都由 Vite 打包（入口 src/renderer/main.ts），这里不再手写标签 -->
  </head>
  <body data-page="dashboard">
    <!-- 图标精灵：内联 SVG，免去额外资源文件 -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-gauge" viewBox="0 0 24 24">
        <path d="M12 13.5l3.5-3.5" />
        <path d="M4.6 19a9 9 0 1 1 14.8 0" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path d="M7 9.5l2.5 2.5L7 14.5" />
        <path d="M13 15h4" />
      </symbol>
      <symbol id="i-shell" viewBox="0 0 24 24">
        <path d="M4.5 7.5l4 4.5-4 4.5" />
        <path d="M12 17h7.5" />
      </symbol>
      <symbol id="i-browser" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="3" />
        <path d="M3 9.5h18" />
        <path d="M6.5 7.2h.01M9.5 7.2h.01" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
        <circle cx="9" cy="7" r="2" />
        <circle cx="15" cy="12" r="2" />
        <circle cx="8" cy="17" r="2" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5l11 7-11 7z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="10" rx="2" />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.4-5.7" />
        <path d="M20 4v5h-5" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6" />
        <path d="M20 4l-9 9" />
        <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2.5" />
        <path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M9.5 7V5h5v2" />
        <path d="M6.5 7l.9 12.2a1 1 0 0 0 1 .8h7.2a1 1 0 0 0 1-.8L17.5 7" />
      </symbol>
      <symbol id="i-replay" viewBox="0 0 24 24">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" />
        <path d="M3 4.5V10h5.5" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 18l-6-6 6-6" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 4l8.5 15h-17z" />
        <path d="M12 10.5v3.5M12 17h.01" />
      </symbol>
      <symbol id="i-usage" viewBox="0 0 24 24">
        <path d="M4 20h16" />
        <rect x="6" y="10" width="3.2" height="6" rx="1.2" />
        <rect x="11" y="5.5" width="3.2" height="10.5" rx="1.2" />
        <rect x="16" y="13" width="3.2" height="3" rx="1.2" />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 24 24">
        <path d="M4 9.5V4h5.5" />
        <path d="M20 14.5V20h-5.5" />
        <path d="M14.5 4H20v5.5" />
        <path d="M9.5 20H4v-5.5" />
      </symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24">
        <path d="M9.5 4v5.5H4" />
        <path d="M14.5 20v-5.5H20" />
        <path d="M20 9.5h-5.5V4" />
        <path d="M4 14.5h5.5V20" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="M15.5 15.5L20 20" />
      </symbol>
      <symbol id="i-plugin" viewBox="0 0 24 24">
        <path d="M10 4h4v2.5a1.8 1.8 0 1 0 3.6 0V4H20v4h-2.4a1.8 1.8 0 1 0 0 3.6H20V16h-2.4" />
        <path
          d="M17.6 16v4h-4v-2.4a1.8 1.8 0 1 0-3.6 0V20H6v-4H4V9.6h2.4a1.8 1.8 0 1 0 0-3.6H4V4h6"
        />
      </symbol>
      <symbol id="i-archive" viewBox="0 0 24 24">
        <rect x="3.5" y="4" width="17" height="4.5" rx="1.2" />
        <path d="M5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5" />
        <path d="M10 12h4" />
      </symbol>
    </svg>

    <div class="app">
      <!-- ============================ 左侧导航 ============================ -->
      <div id="rail-root"></div>

      <!-- ============================ 主区域 ============================ -->
      <div class="workspace">
        <div id="topbar-root"></div>

        <!-- 主界面常驻横幅（没测全 / 逃生之后）：不可关闭，所以它不浮起、不随内容滚走。
             挂在 main 之上、顶栏之下，切到哪一页都看得见（交互 §2.6、§2.8）。 -->
        <div id="gate-banner-root"></div>

        <!-- tabindex=-1：门禁层收起时把焦点交给主内容区（交互 §11.5）。
             它不是可 Tab 到的元素，只用于程序化聚焦。 -->
        <main tabindex="-1">
          <!-- ============================ 控制台 ============================ -->
          <!-- 这一页已迁到 Vue（src/renderer/panes/），这里只留挂载点 -->
          <section class="pane active" id="pane-dashboard">
            <div id="dashboard-root"></div>
          </section>

          <!-- ============================ 终端 ============================ -->
          <!-- dsh 终端 + 本地 Shell 合成一个「终端」页（一条统一会话条）：
               TerminalPane 是会话条的宿主，dsh 那一路是它的子组件 DshTerminal。 -->
          <section class="pane" id="pane-terminal">
            <div id="terminal-root"></div>
          </section>

          <!-- ============================ DeepSeek Harness ============================ -->
          <!-- 这一页已迁到 Vue（src/renderer/panes/），这里只留挂载点 -->
          <section class="pane" id="pane-ui">
            <div id="ui-root"></div>
          </section>

          <!-- ============================ DeepSeek 用量 ============================ -->
          <!-- 这一页已迁到 Vue（src/renderer/panes/），这里只留挂载点 -->
          <section class="pane" id="pane-usage">
            <div id="usage-root"></div>
          </section>

          <!-- ============================ 归档会话 ============================ -->
          <!-- 这一页已迁到 Vue（src/renderer/panes/ArchivePane.vue），这里只留挂载点 -->
          <section class="pane" id="pane-archive">
            <div id="archive-root"></div>
          </section>

          <!-- ============================ 插件 ============================ -->
          <!-- 装配层视图：bundle 层栈 + 生效配置（src/renderer/panes/PluginPane.vue） -->
          <section class="pane" id="pane-plugin">
            <div id="plugin-root"></div>
          </section>

          <!-- ============================ 设置 ============================ -->
          <!-- 这一页已迁到 Vue（src/renderer/panes/SettingsPane.vue），这里只留挂载点 -->
          <section class="pane" id="pane-settings">
            <div id="settings-root"></div>
          </section>

          <!-- 环境自检的详情视图（t45）：左栏不再有这一项，它是设置页「运行环境」卡的详情。
               它是**工作区上的覆盖层**：必须挂在 <main> 里面 —— <main> 是 position: relative，
               它的 inset: 0 正好等于"页面区"（让开左栏、顶栏、状态栏与横幅）。
               挂在 .app 外面（body 下）时 inset: 0 是整个窗口，会把左栏与顶栏一起吃掉
               （踩过：详情视图里左栏不见了，等于把人从"设置"里拽到另一个世界去）。
               它既不是第 8 个页面、也不进 TAB_ORDER；点左栏任何一项都会收掉它。
               挂载点仍是 env-root —— 组件与挂载清单一个字都不用改。 -->
          <div class="env-detail-layer" id="env-detail-layer">
            <div id="env-root"></div>
          </div>
        </main>
      </div>
    </div>

    <div id="statusbar-root"></div>

    <!-- 关闭确认卡片的挂载点：组件自己 Teleport 到 body，这个 div 只是个锚 -->
    <div id="close-dialog-root"></div>

    <!-- 首启环境向导 / 入口门禁：与 #boot-lock 同级的整屏覆盖层（不是左栏第 10 页）。
         盖住顶栏以下的全部内容（含左栏与状态栏），顶栏不设 z-index、窗口还能拖能关；
         层号 --z-gate 低于启动锁，两者互斥。见 docs/env-wizard-freeze.md §1 R-08。 -->
    <div id="gate-root"></div>

    <!-- 启动锁：应用启动时自动拉起 dsh 的那几秒，锁住标题栏以下的所有内容。
         标题栏（顶栏）不锁，窗口还能拖动和关闭。 -->
    <div class="boot-lock hidden" id="boot-lock">
      <div class="boot-card">
        <span class="boot-spinner" aria-hidden="true"></span>
        <h2 class="boot-title" id="boot-title">正在启动 dsh 服务</h2>
        <p class="boot-desc" id="boot-desc">正在拉起进程并等待健康检查</p>
        <p class="boot-note" id="boot-note"></p>
        <button id="btn-boot-skip" class="btn small ghost">不等了，先进入界面</button>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
